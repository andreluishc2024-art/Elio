name: Build Elio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto do Elio
        run: |
          unzip -o Elio-Android-0.1.zip -d elio-project
          cp -r elio-project/.github .
          cp -r elio-project/app .
          cp elio-project/build.gradle.kts .
          cp elio-project/gradle.properties .
          cp elio-project/settings.gradle.kts .

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Elio-0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
